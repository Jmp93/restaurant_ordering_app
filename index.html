<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Restaurant Ordering App</title>
  </head>
  <header>
    <img src="img/header.png" alt="" />
  </header>

  <div id="menu-container" class="menu-container"></div>

  <div id="order-container" class="order-container"></div>

  <div id="payment-modal" class="payment-modal hidden">
    <h2 class="title">Enter Card Details</h2>
    <form id="payment-form" class="payment-form">
      <input
        type="text"
        name="fullName"
        placeholder="Enter your name"
        required
      />
      <input
        type="number"
        name="cardNumber"
        placeholder="Enter card number"
        required
      />
      <input type="number" name="cvv" placeholder="Enter CVV" required />
      <button type="submit" class="pay-btn">Pay</button>
    </form>
  </div>

  <body>
    <script src="script.js" type="module"></script>
  </body>
</html>
